<section
  id="faqs"
  class="py-20 px-24 flex flex-col items-center justify-between font-raleway max-lg:px-6 max-sm:px-4"
>
  <div class="max-w-3xl w-full flex flex-col gap-12">
    <div class="flex flex-col gap-2 items-center text-center">
      <span class="uppercase text-[#121900] bg-[#E7E8E9] rounded-full px-3 py-1">Suporte</span>

      <h1 class="font-extrabold text-[#001A18] text-3xl">Perguntas Frequentes</h1>

      <p class="text-[#404847] font-normal">Tem alguma dúvida? Estamos aqui para ajudar.</p>
    </div>

    <ul class="flex flex-col w-full gap-5">
      @for (item of faqs; track item.question) {
        <li class="flex flex-col gap-3">
          <div
            (click)="toggle(item)"
            class="flex w-full justify-between gap-3 p-6 rounded-3xl bg-tertiary border border-[#C0C8C6]/20 hover:bg-cinza-3/20 transition-all duration-300 cursor-pointer max-sm:p-4"
          >
            {{ item.question }}
            <img
              src="/icons/dropdown.svg"
              alt=""
              class="transition-transform duration-300 shrink-0"
              [class.rotate-180]="item.open"
            />
          </div>

          @if (item.open) {
            <p class="font-normal w-full mx-6">{{ item.answer }}</p>
          }
        </li>
      }
    </ul>
  </div>
</section>
