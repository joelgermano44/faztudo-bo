<section
  class="bg-linear-to-r from-green-1 to-green-2 px-10 py-20 flex justify-center items-center text-white font-raleway relative max-lg:px-6 max-sm:px-4"
>
  <div class="max-w-300 w-full flex flex-col gap-12 text-white">
    <h1 class="font-extrabold text-4xl w-full max-w-188.5 max-sm:text-3xl">
      Queremos que tenha uma vida tranquila ao procurar um
      <span class="text-primary animate-pulse"> óptimo serviço. </span>
    </h1>

    <hr class="w-full border border-white/10" />

    <ul class="flex w-full gap-12 max-lg:flex-wrap">
      @for (item of offerItems; track item.title) {
        <li class="flex gap-4 max-w-88 w-full hover:scale-105 transition-all duration-300 cursor-default">
          <img [src]="item.icon" alt="" class="w-7 h-7" />

          <div class="flex flex-col gap-2 text-white max-w-74.75 w-full">
            <h2 class="font-normal">{{ item.title }}</h2>
            <p class="text-cinza-3 font-normal text-sm">{{ item.description }}</p>
          </div>
        </li>
      }
    </ul>
  </div>

  <img src="/logo-transparent.svg" class="absolute top-0 -right-27" />
</section>
