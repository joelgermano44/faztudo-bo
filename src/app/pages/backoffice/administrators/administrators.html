<div class="flex flex-col font-raleway">
  <app-title-header
    title="Administradores"
    description="Gerencie as contas de administradores da plataforma."
  ></app-title-header>

  <div
    class="mt-6 flex items-center flex-wrap gap-4 py-6 px-4 rounded-lg bg-white shadow-sm shadow-[#0B2E130D] justify-between"
  >
    <ul class="flex max-w-125 w-full gap-3">
      @for (filter of filters; track filter) {
        <li
          (click)="setFilter(filter)"
          [class]="
            (activeFilter() === filter ? 'bg-[#094908] text-white' : 'bg-tertiary') +
            ' flex gap-2 items-center rounded-3xl w-fit px-4 py-2 border border-[#C2C8BE] hover:bg-[#094908] hover:text-white transition-all duration-300 cursor-pointer'
          "
        >
          {{ filterLabels[filter] }}
        </li>
      }
    </ul>

    <div class="flex items-center gap-3 max-sm:flex-wrap">
      <div
        class="flex gap-2 items-center rounded-3xl px-4 py-3 bg-tertiary border border-[#C2C8BE] max-sm:w-full"
      >
        <img src="/icons/dashboard/search-v2.svg" alt="" />
        <input
          type="text"
          placeholder="Buscar administradores..."
          class="outline-none text-sm"
          [value]="searchTerm()"
          (input)="onSearch($any($event.target).value)"
        />
      </div>

      <button
        type="button"
        (click)="openCreateModal()"
        class="flex items-center gap-2 rounded-3xl px-5 py-3 bg-primary text-[#0B2E13] text-sm font-semibold hover:scale-105 transition-all duration-300 cursor-pointer whitespace-nowrap max-sm:w-full max-sm:justify-center"
      >
        <svg width="9" height="9" viewBox="0 0 9 9" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M3.5 4.66667H0V3.5H3.5V0H4.66667V3.5H8.16667V4.66667H4.66667V8.16667H3.5V4.66667Z"
            fill="black"
          />
        </svg>
        Novo Administrador
      </button>
    </div>
  </div>

  <app-administrators-table
    [admins]="filteredAdmins()"
    (edit)="openEditModal($event)"
    (view)="openViewDrawer($event)"
  ></app-administrators-table>
</div>

<app-admin-form-modal
  [open]="isFormModalOpen()"
  [admin]="editingAdmin()"
  (saved)="onAdminSaved()"
  (closed)="closeFormModal()"
></app-admin-form-modal>

<app-admin-view-drawer
  [open]="isViewDrawerOpen()"
  [admin]="viewingAdmin()"
  [avatarUrl]="viewingAdminAvatarUrl()"
  (closed)="closeViewDrawer()"
></app-admin-view-drawer>
