<div
  class="relative overflow-hidden rounded-xl bg-[#094908] flex flex-col justify-between shadow-sm shadow-[#00312E0D] w-full gap-4 h-full p-6 hover:scale-105 transition-all duration-300"
>
  <img
    src="/icons/payments/bank-watermark.svg"
    alt=""
    class="absolute right-0 top-0 h-24 w-24 pointer-events-none"
  />

  <div class="flex justify-between items-start w-full relative">
    <h1 class="text-[20px] font-semibold text-white max-w-40">{{ title() }}</h1>

    <div class="bg-primary/20 rounded-full h-9 w-9 flex items-center justify-center shrink-0">
      <img src="/icons/payments/commissions.svg" alt="" width="20" height="20" />
    </div>
  </div>

  <div class="flex flex-col gap-2 relative">
    <p class="text-5xl font-bold font-radio-canada text-primary">
      {{ value() }}
    </p>

    <div class="h-2 rounded-full bg-[#26611F] w-full">
      <span
        class="block bg-linear-to-r from-[#BFEBE6] to-[#C4F410] h-full rounded-full"
        [style.width.%]="paidPercent()"
      ></span>
    </div>

    <span class="text-sm font-normal text-[#C2C8BE]">KZ</span>
  </div>

  <span class="text-xs font-normal text-[#C2C8BE]">Já repassado: {{ paidPercent() }}%</span>
</div>
