<div
  class="rounded-xl bg-white flex flex-col justify-between shadow-sm shadow-[#00312E0D] w-full gap-4 h-full p-6 hover:scale-105 hover:bg-white/50 transition-all duration-300"
>
  <div class="flex justify-between items-start w-full">
    <h1 class="text-[20px] font-semibold text-[#191C1D] max-w-40">{{ title() }}</h1>

    <div class="rounded-full h-9 w-9 flex items-center justify-center shrink-0 {{ iconBg() }}">
      <img [src]="icon()" alt="" width="20" height="20" />
    </div>
  </div>

  <div class="flex flex-col gap-4">
    <p class="text-5xl font-bold font-radio-canada {{ valueColor() }}">
      {{ value() }}
    </p>

    <span class="text-sm font-normal text-[#8C9492]">KZ</span>

    <div class="flex items-center gap-2 mt-1">
      @if (trend(); as trend) {
        <span
          [class]="
            (trendPositive() ? 'text-[#96D786] bg-[#0949081A]' : 'text-[#93000A] bg-[#93000A1A]') +
            ' px-2 py-1 text-xs flex gap-1 items-center rounded-md font-semibold w-fit'
          "
        >
          <svg
            width="12"
            height="7"
            viewBox="0 0 12 7"
            fill="none"
            [class.rotate-180]="!trendPositive()"
          >
            <path
              d="M0.816667 7L0 6.18333L4.31667 1.8375L6.65 4.17083L9.68333 1.16667H8.16667V0H11.6667V3.5H10.5V1.98333L6.65 5.83333L4.31667 3.5L0.816667 7Z"
              [attr.fill]="trendPositive() ? '#96D786' : '#93000A'"
            />
          </svg>
          {{ trend }}
        </span>
      }
      @if (subtitle()) {
        <span class="text-xs text-[#8C9492]">{{ subtitle() }}</span>
      }
    </div>
  </div>
</div>
