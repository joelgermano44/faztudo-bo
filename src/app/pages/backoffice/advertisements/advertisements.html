<div class="flex flex-col font-raleway">
  <div class="flex items-center justify-between flex-wrap gap-4">
    <app-title-header
      title="Gestão de Publicidades"
      description="Monitorize e gira as campanhas publicitárias da plataforma."
    ></app-title-header>

    <button
      type="button"
      (click)="openCreateModal()"
      class="flex items-center gap-2 rounded-2xl px-5 py-3 bg-primary text-black text-base font-semibold hover:scale-105 transition-all duration-300 cursor-pointer"
    >
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
        <path
          d="M9 15H11V11H15V9H11V5H9V9H5V11H9V15ZM10 20C8.61667 20 7.31667 19.7375 6.1 19.2125C4.88333 18.6875 3.825 17.975 2.925 17.075C2.025 16.175 1.3125 15.1167 0.7875 13.9C0.2625 12.6833 0 11.3833 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3833 0 12.6833 0.2625 13.9 0.7875C15.1167 1.3125 16.175 2.025 17.075 2.925C17.975 3.825 18.6875 4.88333 19.2125 6.1C19.7375 7.31667 20 8.61667 20 10C20 11.3833 19.7375 12.6833 19.2125 13.9C18.6875 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6875 13.9 19.2125C12.6833 19.7375 11.3833 20 10 20ZM10 18C12.2333 18 14.125 17.225 15.675 15.675C17.225 14.125 18 12.2333 18 10C18 7.76667 17.225 5.875 15.675 4.325C14.125 2.775 12.2333 2 10 2C7.76667 2 5.875 2.775 4.325 4.325C2.775 5.875 2 7.76667 2 10C2 12.2333 2.775 14.125 4.325 15.675C5.875 17.225 7.76667 18 10 18Z"
          fill="black"
        />
      </svg>
      Nova Campanha
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-8">
    <app-ad-stat-card
      icon="/icons/advertisements/campaigns.svg"
      label="Total de Campanhas"
      [value]="totalCampaigns().toString()"
      [badge]="campaignsTrend()?.text ?? null"
      [badgeDirection]="campaignsTrend()?.direction ?? 'neutral'"
    ></app-ad-stat-card>

    <app-ad-stat-card
      icon="/icons/advertisements/clicks.svg"
      iconBg="bg-[#E8F0FE]"
      label="Cliques Totais"
      [value]="totalClicksLabel()"
    ></app-ad-stat-card>

    <app-ad-stat-card
      icon="/icons/advertisements/eye.svg"
      iconBg="bg-[#E9F7E4]"
      label="Campanhas Ativas"
      [value]="activeCampaigns().length.toString()"
      [badge]="activePercent() + '% do total'"
      badgeDirection="neutral"
    ></app-ad-stat-card>
  </div>

  <div
    class="mt-6 flex items-center flex-wrap gap-4 py-6 px-4 rounded-lg bg-white shadow-sm shadow-[#0B2E130D] justify-between"
  >
    <div class="flex items-center gap-2 text-xs font-semibold text-[#41493D] uppercase">
      <img src="/icons/services/filter.svg" alt="" width="16" height="14" />
      Filtros
    </div>

    <div class="flex items-center gap-3">
      <!-- Status -->
      <div class="relative">
        <button
          type="button"
          (click)="toggleStatusMenu()"
          class="flex items-center gap-2 rounded-3xl px-5 py-3 bg-[#f2f4f3] border border-[#E2E8F0] text-sm text-[#41493D] hover:bg-gray-100 transition-all duration-300 cursor-pointer"
        >
          {{ activeFilter() }}
          <img src="/icons/dropdown.svg" alt="" width="10" height="7" />
        </button>

        @if (isStatusMenuOpen()) {
          <div
            class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-[#0000001A] overflow-hidden z-10"
          >
            @for (filter of filters; track filter) {
              <button
                type="button"
                (click)="setFilter(filter)"
                [class]="
                  'w-full text-left px-4 py-2.5 text-sm hover:bg-tertiary/80 transition-colors cursor-pointer ' +
                  (activeFilter() === filter ? 'font-semibold text-[#094908]' : 'text-[#41493D]')
                "
              >
                {{ filter }}
              </button>
            }
          </div>
        }
      </div>

      <div
        class="flex gap-2 items-center rounded-3xl px-4 py-3 bg-tertiary border border-[#C2C8BE]"
      >
        <img src="/icons/dashboard/search-v2.svg" alt="" />
        <input
          type="text"
          placeholder="Buscar campanhas..."
          class="outline-none text-sm"
          [value]="searchTerm()"
          (input)="onSearch($any($event.target).value)"
        />
      </div>
    </div>
  </div>

  <app-advertisements-table
    [advertisements]="filteredAdvertisements()"
    (view)="openViewDrawer($event)"
    (edit)="openEditModal($event)"
    (toggleActive)="toggleActive($event)"
    (remove)="requestDelete($event)"
  ></app-advertisements-table>
</div>

<app-advertisement-form-modal
  [open]="isFormModalOpen()"
  [advertisement]="editingAdvertisement()"
  (saved)="onAdvertisementSaved()"
  (closed)="closeFormModal()"
></app-advertisement-form-modal>

<app-advertisement-view-drawer
  [open]="isViewDrawerOpen()"
  [advertisement]="viewingAdvertisement()"
  (closed)="closeViewDrawer()"
></app-advertisement-view-drawer>

<app-modal
  [open]="isDeleteConfirmOpen()"
  title="Eliminar campanha"
  size="sm"
  [closeable]="!isDeleting()"
  (closed)="cancelDelete()"
>
  <div class="flex flex-col gap-6">
    <p class="text-sm text-[#41493D]">
      Tem a certeza que deseja eliminar a campanha
      <strong class="text-[#062406]">{{ deletingAdvertisement()?.title }}</strong
      >? Esta ação não pode ser revertida.
    </p>

    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        (click)="cancelDelete()"
        [disabled]="isDeleting()"
        class="cursor-pointer rounded-full px-6 py-3 text-sm font-semibold text-[#41493D] transition-all duration-300 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-60"
      >
        Cancelar
      </button>

      <button
        type="button"
        (click)="confirmDelete()"
        [disabled]="isDeleting()"
        class="flex cursor-pointer items-center justify-center gap-2 rounded-full bg-red-600 px-6 py-3 text-sm font-semibold text-white shadow-xs shadow-black/10 transition-all duration-300 hover:scale-[1.02] hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:scale-100"
      >
        @if (isDeleting()) {
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            ></path>
          </svg>
          A eliminar...
        } @else {
          Eliminar
        }
      </button>
    </div>
  </div>
</app-modal>
