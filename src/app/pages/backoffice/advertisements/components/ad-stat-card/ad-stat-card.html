<div
  class="rounded-xl bg-white flex flex-col shadow-sm shadow-[#00312E0D] w-full gap-3 p-5 hover:scale-105 transition-all duration-300"
>
  <div class="flex items-center justify-between w-full">
    <div class="rounded-full h-10 w-10 flex items-center justify-center shrink-0 {{ iconBg() }}">
      <img [src]="icon()" alt="" width="16" height="16" />
    </div>

    @if (badge(); as badge) {
      <span
        class="px-2 py-1 text-xs flex gap-1 items-center rounded-full font-semibold w-fit {{
          badgeClass()
        }}"
      >
        @if (badgeDirection() === 'up') {
          <svg width="10" height="6" viewBox="0 0 12 7" fill="none">
            <path
              d="M0.816667 7L0 6.18333L4.31667 1.8375L6.65 4.17083L9.68333 1.16667H8.16667V0H11.6667V3.5H10.5V1.98333L6.65 5.83333L4.31667 3.5L0.816667 7Z"
              fill="currentColor"
            />
          </svg>
        } @else if (badgeDirection() === 'down') {
          <svg width="10" height="6" viewBox="0 0 12 7" fill="none" class="rotate-180">
            <path
              d="M0.816667 7L0 6.18333L4.31667 1.8375L6.65 4.17083L9.68333 1.16667H8.16667V0H11.6667V3.5H10.5V1.98333L6.65 5.83333L4.31667 3.5L0.816667 7Z"
              fill="currentColor"
            />
          </svg>
        } @else {
          <svg width="10" height="6" viewBox="0 0 12 7" fill="none">
            <path d="M0 3H12" stroke="#727970" stroke-width="1.4" />
          </svg>
        }
        {{ badge }}
      </span>
    }
  </div>

  <div class="flex flex-col gap-1">
    <p class="text-xs font-semibold uppercase text-[#727970]">{{ label() }}</p>

    <p class="text-3xl font-bold text-[#191C1C]">
      {{ value() }}

      @if (unit()) {
        <span class="text-lg font-semibold text-[#094908]">{{ unit() }}</span>
      }
    </p>
  </div>
</div>
