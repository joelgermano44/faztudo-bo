<app-modal
  [open]="open()"
  [title]="editing() ? 'Editar campanha' : 'Nova campanha'"
  size="lg"
  [closeable]="!saving()"
  (closed)="requestClose()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6">
    <!-- Nome -->
    <div class="flex flex-col gap-2">
      <label for="ad-title" class="text-sm font-semibold text-[#001A18]">Nome da campanha</label>
      <input
        id="ad-title"
        type="text"
        formControlName="title"
        placeholder="ex.: Promoção de Verão"
        class="w-full rounded-2xl border border-[#C0C8C6]/40 bg-white px-5 py-3.5 outline-none transition-all duration-300 placeholder:text-[#8C9492] focus:border-secondary"
        [class.border-red-500]="form.controls.title.invalid && form.controls.title.touched"
      />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <span class="text-xs text-red-500">O nome é obrigatório.</span>
      }
    </div>

    <!-- Link -->
    <div class="flex flex-col gap-2">
      <label for="ad-link" class="text-sm font-semibold text-[#001A18]">Link de destino</label>
      <input
        id="ad-link"
        type="url"
        formControlName="link"
        placeholder="https://..."
        class="w-full rounded-2xl border border-[#C0C8C6]/40 bg-white px-5 py-3.5 outline-none transition-all duration-300 placeholder:text-[#8C9492] focus:border-secondary"
        [class.border-red-500]="form.controls.link.invalid && form.controls.link.touched"
      />
      @if (form.controls.link.invalid && form.controls.link.touched) {
        <span class="text-xs text-red-500">O link é obrigatório.</span>
      }
    </div>

    <!-- Descrição -->
    <div class="flex flex-col gap-2">
      <label for="ad-description" class="text-sm font-semibold text-[#001A18]">Descrição</label>
      <textarea
        id="ad-description"
        formControlName="description"
        rows="3"
        placeholder="Descreva a campanha (opcional)..."
        class="w-full resize-none rounded-2xl border border-[#C0C8C6]/40 bg-white px-5 py-3.5 outline-none transition-all duration-300 placeholder:text-[#8C9492] focus:border-secondary"
      ></textarea>
    </div>

    <!-- Ativa -->
    <label class="flex w-fit cursor-pointer items-center gap-3">
      <input
        type="checkbox"
        formControlName="is_active"
        class="h-5 w-5 rounded border-[#C0C8C6] accent-primary cursor-pointer"
      />
      <span class="text-sm font-semibold text-[#001A18]">Campanha ativa</span>
    </label>

    <!-- Imagens -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-semibold text-[#001A18]">Imagens</label>

      <div class="flex flex-wrap gap-3">
        @for (image of existingImages(); track image.id) {
          <div class="relative h-20 w-20">
            <img
              [src]="image.url"
              alt=""
              class="h-full w-full rounded-xl object-cover border border-[#0000001A]"
            />
            <button
              type="button"
              (click)="removeExistingImage(image)"
              aria-label="Remover imagem"
              class="absolute -right-1.5 -top-1.5 flex h-5 w-5 items-center justify-center rounded-full bg-white text-[#41493D] shadow-sm cursor-pointer hover:scale-110 transition-all duration-300"
            >
              <svg width="9" height="9" viewBox="0 0 14 14" fill="none">
                <path
                  d="M1 1L13 13M13 1L1 13"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        }

        @for (preview of newImagePreviews(); track $index) {
          <div class="relative h-20 w-20">
            <img
              [src]="preview"
              alt=""
              class="h-full w-full rounded-xl object-cover border border-secondary/40"
            />
            <button
              type="button"
              (click)="removeNewImage($index)"
              aria-label="Remover imagem"
              class="absolute -right-1.5 -top-1.5 flex h-5 w-5 items-center justify-center rounded-full bg-white text-[#41493D] shadow-sm cursor-pointer hover:scale-110 transition-all duration-300"
            >
              <svg width="9" height="9" viewBox="0 0 14 14" fill="none">
                <path
                  d="M1 1L13 13M13 1L1 13"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        }

        <label
          class="flex h-20 w-20 cursor-pointer flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-[#C0C8C6] text-[#8C9492] transition-all duration-300 hover:border-secondary hover:text-secondary"
        >
          <svg width="18" height="18" viewBox="0 0 9 9" fill="none">
            <path
              d="M3.5 4.66667H0V3.5H3.5V0H4.66667V3.5H8.16667V4.66667H4.66667V8.16667H3.5V4.66667Z"
              fill="currentColor"
            />
          </svg>
          <span class="text-[10px] font-medium">Adicionar</span>
          <input
            type="file"
            accept="image/*"
            multiple
            class="hidden"
            (change)="onImagesSelected($event)"
          />
        </label>
      </div>
    </div>

    <div class="mt-2 flex items-center justify-end gap-3 border-t border-[#0B2E130D] pt-5">
      <button
        type="button"
        (click)="requestClose()"
        [disabled]="saving()"
        class="cursor-pointer rounded-full px-6 py-3 text-sm font-semibold text-[#41493D] transition-all duration-300 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-60"
      >
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="saving()"
        class="flex cursor-pointer items-center justify-center gap-2 rounded-full bg-primary px-6 py-3 text-sm font-semibold text-[#0B2E13] shadow-xs shadow-black/10 transition-all duration-300 hover:scale-[1.02] hover:bg-primary/80 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:scale-100"
      >
        @if (saving()) {
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            ></path>
          </svg>
          A guardar...
        } @else {
          {{ editing() ? 'Guardar alterações' : 'Criar campanha' }}
        }
      </button>
    </div>
  </form>
</app-modal>
