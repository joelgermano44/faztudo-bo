<div class="flex flex-col font-raleway">
  <app-title-header
    title="Contratos"
    description="Gerencie e acompanhe todos os contratos de prestação de serviços da plataforma."
  ></app-title-header>

  <div
    class="mt-6 flex items-center py-6 px-4 rounded-lg bg-white shadow-sm shadow-[#0B2E130D] justify-between"
  >
    <ul class="flex max-w-125 w-full gap-3">
      @for (filter of filters; track filter) {
        <li
          (click)="setFilter(filter)"
          [class]="
            (activeFilter() === filter ? 'bg-[#094908] text-white' : 'bg-tertiary') +
            ' flex gap-2 items-center rounded-3xl w-fit px-4 py-2 border border-[#C2C8BE] hover:bg-[#094908] hover:text-white transition-all duration-300 cursor-pointer'
          "
        >
          {{ filterLabels[filter] }}
        </li>
      }
    </ul>

    <div class="flex gap-2 items-center rounded-3xl px-4 py-3 bg-tertiary border border-[#C2C8BE]">
      <img src="/icons/dashboard/search-v2.svg" alt="" />
      <input
        type="text"
        placeholder="Buscar contratos..."
        class="outline-none text-sm"
        [value]="searchTerm()"
        (input)="onSearch($any($event.target).value)"
      />
    </div>
  </div>

  <app-orders-table [orders]="filteredOrders()"></app-orders-table>
</div>
