<div class="flex flex-col font-raleway">
  <app-title-header
    title="Contratos"
    description="Gerencie e acompanhe todos os contratos de prestação de serviços da plataforma."
  ></app-title-header>

  <div
    class="mt-6 flex items-center flex-wrap gap-4 py-6 px-4 rounded-lg bg-white shadow-sm shadow-[#0B2E130D] justify-between"
  >
    <div class="flex items-center gap-2 text-xs font-semibold text-[#41493D] uppercase">
      <img src="/icons/services/filter.svg" alt="" width="16" height="14" />
      Filtros
    </div>

    <div class="flex items-center gap-3 max-sm:flex-wrap">
      <!-- Status -->
      <div class="relative">
        <button
          type="button"
          (click)="toggleStatusMenu()"
          class="flex items-center gap-2 rounded-3xl px-5 py-3 bg-[#f2f4f3] border border-[#E2E8F0] text-sm text-[#41493D] hover:bg-gray-100 transition-all duration-300 cursor-pointer"
        >
          {{ filterLabels[activeFilter()] }}
          <img src="/icons/dropdown.svg" alt="" width="10" height="7" />
        </button>

        @if (isStatusMenuOpen()) {
          <div
            class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-[#0000001A] overflow-hidden z-10"
          >
            @for (filter of filters; track filter) {
              <button
                type="button"
                (click)="setFilter(filter)"
                [class]="
                  'w-full text-left px-4 py-2.5 text-sm hover:bg-tertiary/80 transition-colors cursor-pointer ' +
                  (activeFilter() === filter ? 'font-semibold text-[#094908]' : 'text-[#41493D]')
                "
              >
                {{ filterLabels[filter] }}
              </button>
            }
          </div>
        }
      </div>

      <div
        class="flex gap-2 items-center rounded-3xl px-4 py-3 bg-tertiary border border-[#C2C8BE] max-sm:w-full"
      >
        <img src="/icons/dashboard/search-v2.svg" alt="" />
        <input
          type="text"
          placeholder="Buscar contratos..."
          class="outline-none text-sm"
          [value]="searchTerm()"
          (input)="onSearch($any($event.target).value)"
        />
      </div>
    </div>
  </div>

  <app-orders-table
    [orders]="filteredOrders()"
    [isLoading]="isLoading()"
    [loadError]="loadError()"
    (retry)="retryLoad()"
    (reject)="requestReject($event)"
  ></app-orders-table>
</div>

<app-modal
  [open]="isRejectModalOpen()"
  title="Rejeitar contrato"
  size="sm"
  [closeable]="!isRejecting()"
  (closed)="cancelReject()"
>
  <div class="flex flex-col gap-5">
    <p class="text-sm text-[#41493D]">
      Indique o motivo da rejeição do contrato
      <strong class="text-[#062406]">#CTR-{{ rejectingOrder()?.id }}</strong>. Esta informação
      poderá ser partilhada com o cliente e o prestador.
    </p>

    <div class="flex flex-col gap-2">
      <label for="order-reject-reason" class="text-sm font-semibold text-[#001A18]">Motivo</label>
      <textarea
        id="order-reject-reason"
        rows="4"
        placeholder="Descreva o motivo da rejeição..."
        class="w-full resize-none rounded-2xl border border-[#C0C8C6]/40 bg-white px-5 py-3.5 outline-none transition-all duration-300 placeholder:text-[#8C9492] focus:border-secondary"
        [value]="rejectReason()"
        (input)="rejectReason.set($any($event.target).value)"
      ></textarea>
    </div>

    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        (click)="cancelReject()"
        [disabled]="isRejecting()"
        class="cursor-pointer rounded-full px-6 py-3 text-sm font-semibold text-[#41493D] transition-all duration-300 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-60"
      >
        Cancelar
      </button>

      <button
        type="button"
        (click)="confirmReject()"
        [disabled]="isRejecting() || !rejectReason().trim()"
        class="flex cursor-pointer items-center justify-center gap-2 rounded-full bg-red-600 px-6 py-3 text-sm font-semibold text-white shadow-xs shadow-black/10 transition-all duration-300 hover:scale-[1.02] hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:scale-100"
      >
        @if (isRejecting()) {
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            ></path>
          </svg>
          A rejeitar...
        } @else {
          Rejeitar contrato
        }
      </button>
    </div>
  </div>
</app-modal>
