<div class="bg-white rounded-xl border border-[#C2C8BE33] shadow-sm p-6 flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-black flex items-center gap-2">
    <img src="/icons/orders/person.svg" alt="" width="16" height="16" />
    Cliente
  </h2>

  <div class="flex items-center gap-3">
    <img
      [src]="avatar() || '/icons/user.svg'"
      [alt]="name()"
      class="w-10 h-10 rounded-full object-cover"
    />
    <div>
      <p class="font-semibold text-[#292D32]">{{ name() }}</p>
      <p class="text-sm text-[#424841]">{{ since() }}</p>
    </div>
  </div>

  <div class="flex gap-4">
    <img src="/icons/orders/phone.svg" alt="" width="15" height="17" />

    <div>
      <p class="text-xs uppercase text-[#424841] font-semibold">Contacto</p>
      <p class="text-sm text-[#191C1D] mt-1">{{ phone() }}</p>
    </div>
  </div>

  @if (location()) {
    <div class="flex gap-4">
      <img src="/icons/orders/location.svg" alt="" width="14" height="19" />

      <div>
        <p class="text-xs uppercase text-[#424841] font-semibold">Localização</p>
        <p class="text-sm text-[#191C1D] mt-1">{{ location() }}</p>
      </div>
    </div>
  }
</div>
