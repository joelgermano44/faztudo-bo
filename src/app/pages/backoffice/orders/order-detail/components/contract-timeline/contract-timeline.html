<div class="bg-white rounded-xl border border-[#C2C8BE33] shadow-sm p-6 flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-[#191C1D] flex items-center gap-2">
    <img src="/icons/orders/history.svg" alt="" width="18" height="18" />

    Histórico do Contrato
  </h2>

  <div class="flex flex-col gap-4 relative">
    <div class="h-full border-l-2 min-h-2 border-[#E1E3E2] absolute top-0 left-3"></div>
    @for (item of items(); track $index) {
      <div class="flex gap-3">
        <div class="w-2 h-2 rounded-full bg-black mt-1.5 shrink-0"></div>
        <div>
          <p class="text-xs text-[#424841] font-semibold">{{ item.date }}</p>
          <p class="text-base font-semibold text-[#191C1D]">{{ item.label }}</p>
          @if (item.description) {
            <p class="text-xs text-gray-500">{{ item.description }}</p>
          }
        </div>
      </div>
    } @empty {
      <p class="text-sm text-gray-500">Sem histórico disponível.</p>
    }
  </div>
</div>
