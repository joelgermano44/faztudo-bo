<div class="bg-white rounded-xl border border-[#C2C8BE33] shadow-sm p-6 flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-[#191C1D] flex items-center gap-2">
    <img src="/icons/orders/info-circle.svg" alt="" width="20" height="20" />
    Detalhes do Serviço
  </h2>

  @if (image()) {
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="openLightbox(0)"
        class="group relative h-20 w-20 shrink-0 overflow-hidden rounded-xl border border-[#0000001A]"
      >
        <img [src]="image()" [alt]="serviceName()" class="h-full w-full object-cover" />
        <div
          class="absolute inset-0 bg-black/0 transition-all duration-300 group-hover:bg-black/30"
        ></div>
      </button>

      @for (thumb of gallery(); track thumb; let i = $index) {
        <button
          type="button"
          (click)="openLightbox(i + 1)"
          class="group relative h-20 w-20 shrink-0 overflow-hidden rounded-xl border border-[#0000001A]"
        >
          <img [src]="thumb" alt="" class="h-full w-full object-cover" />
          <div
            class="absolute inset-0 bg-black/0 transition-all duration-300 group-hover:bg-black/30"
          ></div>
        </button>
      }
    </div>
  }

  <div class="grid grid-cols-2 gap-4 max-sm:grid-cols-1">
    <div>
      <p class="text-xs uppercase text-[#424841] font-semibold">Modalidade</p>
      <p class="text-base text-[#191C1D] flex items-center gap-2">
        <img src="/icons/orders/home.svg" alt="" width="12" height="14" />
        {{ modalityLabel() }}
      </p>
    </div>
    <div>
      <p class="text-xs uppercase text-[#424841] font-semibold">Data / Hora Agendada</p>
      <p class="text-base text-[#191C1D] flex items-center gap-2">
        <img src="/icons/orders/calendar.svg" alt="" width="14" height="15" />
        {{ scheduledDate() }}
      </p>
    </div>
  </div>

  <div>
    <p class="text-xs uppercase text-[#424841] font-semibold">Descrição da Solicitação</p>
    <p class="text-sm text-[#41493D] mt-2 bg-[#F2F4F3] rounded-lg p-4 border border-[#E2E8F0]">
      {{ description() || 'Sem descrição.' }}
    </p>
  </div>
</div>

<app-image-viewer
  [open]="lightboxOpen()"
  [images]="allImages()"
  [startIndex]="lightboxIndex()"
  [alt]="serviceName()"
  (closed)="closeLightbox()"
></app-image-viewer>
