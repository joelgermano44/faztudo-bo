<div class="bg-white rounded-xl border border-[#C2C8BE33] shadow-sm p-6 flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-semibold text-black flex items-center gap-2">
      <img src="/icons/orders/team.svg" alt="" width="22" height="18" />
      Prestador
    </h2>
  </div>

  <a
    [routerLink]="['/dashboard/professionals-users']"
    [queryParams]="{ q: name() }"
    class="flex items-center gap-3 rounded-lg -m-2 p-2 hover:bg-tertiary/50 transition-colors cursor-pointer"
  >
    <img
      [src]="avatar() || '/icons/user.svg'"
      [alt]="name()"
      class="w-10 h-10 rounded-full object-cover"
    />
    <div>
      <p class="font-semibold text-[#191C1D]">{{ name() }}</p>
      <p class="text-sm text-[#424841] font-normal">
        {{ profession() }}
        @if (rating()) {
          ({{ rating() }} ★)
        }
      </p>
    </div>
  </a>

  <div class="flex gap-4">
    <img src="/icons/orders/phone.svg" alt="" width="15" height="17" />

    <div>
      <p class="text-xs uppercase text-[#424841] font-semibold">Contacto</p>
      <p class="text-sm text-[#191C1D] mt-1">{{ phone() }}</p>
    </div>
  </div>

  <div class="flex flex-wrap gap-2 pt-2 border-t border-[#C2C8BE33]">
    <a
      [href]="'tel:' + phone()"
      class="flex items-center gap-1.5 rounded-lg border border-[#C2C8BE33] px-3 py-2 text-xs font-semibold text-[#191C1D] hover:bg-tertiary/50 transition-colors"
    >
      <img src="/icons/orders/phone.svg" alt="" width="13" height="14" />
      Ligar
    </a>

    @if (email()) {
      <a
        [href]="'mailto:' + email()"
        class="flex items-center gap-1.5 rounded-lg border border-[#C2C8BE33] px-3 py-2 text-xs font-semibold text-[#191C1D] hover:bg-tertiary/50 transition-colors"
      >
        <svg width="14" height="12" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M2 2h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"
            stroke="#191C1D"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="m1.5 3 8.5 6 8.5-6"
            stroke="#191C1D"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        E-mail
      </a>
    }

    <a
      [routerLink]="['/dashboard/admin-support-chat']"
      [queryParams]="{ q: name() }"
      class="flex items-center gap-1.5 rounded-lg border border-[#C2C8BE33] px-3 py-2 text-xs font-semibold text-[#191C1D] hover:bg-tertiary/50 transition-colors"
    >
      <img src="/icons/orders/chat.svg" alt="" width="14" height="14" />
      Mensagem
    </a>
  </div>
</div>
