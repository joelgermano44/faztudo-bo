<div
  class="flex flex-col h-full bg-white shadow-sm shadow-[#0B2E130D] border border-[#C2C8BE33] rounded-xl w-full max-w-90 shrink-0"
>
  <div class="flex flex-col gap-4 p-5 border-b border-[#C2C8BE33]">
    <h2 class="text-lg font-semibold text-[#191C1D]">Mensagens</h2>

    <div class="flex items-center gap-1 rounded-full bg-[#F2F4F3] p-1">
      @for (filter of filters; track filter) {
        <button
          type="button"
          (click)="filterChange.emit(filter)"
          class="flex-1 rounded-full px-3 py-1.5 text-xs font-semibold transition-all duration-300 cursor-pointer whitespace-nowrap {{
            filterButtonClass(filter)
          }}"
        >
          {{ filter }}
        </button>
      }
    </div>

    <div
      class="flex gap-2 items-center rounded-3xl px-4 py-2.5 bg-tertiary border border-[#E2E8F0]"
    >
      <img src="/icons/dashboard/search-v2.svg" alt="" width="16" height="16" />
      <input
        type="text"
        placeholder="Filtrar..."
        class="outline-none text-sm w-full bg-transparent"
        [value]="searchTerm()"
        (input)="searchChange.emit($any($event.target).value)"
      />
    </div>
  </div>

  <div class="flex-1 overflow-y-auto">
    @for (conversation of conversations(); track conversation.id) {
      <button
        type="button"
        (click)="select.emit(conversation.id)"
        class="flex w-full items-start gap-3 border-b border-[#C2C8BE1A] px-5 py-4 text-left hover:bg-gray-50 transition-all duration-300 cursor-pointer {{
          rowClass(conversation)
        }}"
      >
        <img
          [src]="avatarUrl(conversation) || '/icons/user.svg'"
          [alt]="conversation.party.name"
          class="h-10 w-10 rounded-full object-cover shrink-0"
        />

        <div class="flex min-w-0 flex-1 flex-col gap-0.5">
          <div class="flex items-center justify-between gap-2">
            <span class="truncate font-semibold text-sm text-[#191C1D]">{{
              conversation.party.name
            }}</span>
            <span class="shrink-0 text-xs text-[#8C9492]">{{
              timestamp(conversation.last_message_at)
            }}</span>
          </div>
          <p class="truncate text-sm text-gray-500">
            {{ conversation.last_message_preview || 'Sem mensagens' }}
          </p>
          <div class="mt-1 flex items-center justify-between gap-2">
            <span
              class="w-fit rounded-full bg-gray-100 px-2 py-0.5 text-[10px] font-medium text-gray-600"
            >
              {{ roleLabel(conversation) }}
            </span>
            @if (conversation.unread_count > 0) {
              <span
                class="flex h-5 w-5 items-center justify-center rounded-full bg-[#094908] text-[10px] font-bold text-white"
              >
                {{ conversation.unread_count }}
              </span>
            }
          </div>
        </div>
      </button>
    } @empty {
      <p class="p-6 text-center text-sm text-gray-500">Nenhuma conversa encontrada.</p>
    }

    @if (hasMore()) {
      <button
        type="button"
        (click)="loadMore.emit()"
        [disabled]="loading()"
        class="w-full py-4 text-sm font-medium text-[#0B2E13] hover:underline cursor-pointer disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (loading()) {
          A carregar...
        } @else {
          Carregar mais
        }
      </button>
    }
  </div>
</div>
