<div
  class="bg-white flex-col h-full flex gap-4 rounded-2xl border border-[#C2C8BE33] shadow-[#C2C8BE33] shadow-sm p-6 w-full"
>
  <h2 class="text-lg font-semibold text-[#191C1D]">{{ title }}</h2>

  <div class="flex flex-col gap-4">
    @for (item of items(); track item.label) {
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-sm text-[#424841] font-normal">{{ item.label }}</span>
          <span class="text-sm font-medium text-[#191C1D]">{{ item.count }}</span>
        </div>

        <div class="w-full bg-[#E7E8E9] h-2 rounded-full overflow-hidden">
          <div
            class="h-full rounded-full {{ item.barColor }}"
            [style.width.%]="item.progressPercent"
          ></div>
        </div>
      </div>
    }
  </div>
</div>
