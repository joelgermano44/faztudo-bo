<div
  class="bg-white flex-col h-full flex gap-4 rounded-2xl border border-[#C2C8BE33] shadow-[#C2C8BE33] shadow-sm p-6 w-full"
>
  <h2 class="text-lg font-semibold text-[#191C1D]">{{ title }}</h2>

  <div class="flex flex-col gap-4">
    @if (isLoading()) {
      @for (row of [0, 1]; track row) {
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <app-skeleton width="80px" height="12px" />
            <app-skeleton width="24px" height="12px" />
          </div>
          <app-skeleton height="8px" />
        </div>
      }
    } @else if (loadError()) {
      <app-empty-state
        variant="error"
        title="Não foi possível carregar o status dos profissionais"
        description="Verifique a sua ligação e tente novamente."
        actionLabel="Tentar novamente"
        (action)="retryLoad()"
      ></app-empty-state>
    } @else {
      @for (item of items(); track item.label) {
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="text-sm text-[#424841] font-normal">{{ item.label }}</span>
            <span class="text-sm font-medium text-[#191C1D]">{{ item.count }}</span>
          </div>

          <div class="w-full bg-[#E7E8E9] h-2 rounded-full overflow-hidden">
            <div
              class="h-full rounded-full {{ item.barColor }}"
              [style.width.%]="item.progressPercent"
            ></div>
          </div>
        </div>
      }
    }
  </div>
</div>
