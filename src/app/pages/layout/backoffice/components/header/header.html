<header class="bg-[#E0E0E0A6] py-5 w-full px-8 flex items-center justify-between">
  <div class="flex rounded-4xl px-2 py-3 items-center gap-2 bg-tertiary max-w-2xl w-full">
    <img src="/icons/dashboard/search.svg" alt="" />
    <input
      type="text"
      class="w-full outline-none placeholder:text-[#6B7280]"
      placeholder="Pesquisar"
    />
  </div>

  <div class="flex gap-8">
    <div class="flex gap-3">
      <div class="relative">
        <button
          type="button"
          (click)="toggleNotifications()"
          class="relative px-3 py-2 h-full hover:bg-tertiary/80 transition-all cursor-pointer rounded-lg"
        >
          <img src="/icons/dashboard/notification.svg" alt="" />
          @if (unreadCount() > 0) {
            <span
              class="absolute top-0.5 right-0.5 bg-red-600 text-white text-[10px] leading-none rounded-full min-w-4 h-4 px-1 flex items-center justify-center"
            >
              {{ unreadCount() }}
            </span>
          }
        </button>

        @if (isNotificationsOpen()) {
          <div
            class="absolute right-0 top-full mt-2 w-80 bg-white rounded-lg shadow-lg border border-[#0000001A] overflow-hidden z-10"
          >
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
              <h2 class="text-sm font-semibold text-[#191C1D]">Notificações</h2>
              @if (unreadCount() > 0) {
                <button
                  type="button"
                  (click)="markAllNotificationsAsRead()"
                  class="text-xs text-emerald-700 hover:underline cursor-pointer"
                >
                  Marcar todas como lidas
                </button>
              }
            </div>

            <div class="max-h-80 overflow-y-auto divide-y divide-gray-50">
              @for (notification of recentNotifications(); track notification.id) {
                <button
                  type="button"
                  (click)="onNotificationClick(notification.id)"
                  class="w-full text-left flex gap-3 px-4 py-3 hover:bg-tertiary/50 transition-colors cursor-pointer"
                >
                  <div class="w-8 h-8 rounded-full bg-[#E6E9E8] flex items-center justify-center shrink-0">
                    <img [src]="notificationIcon(notification.event_type)" alt="" class="w-3.5 h-3.5" />
                  </div>
                  <div class="flex-1 min-w-0">
                    <p
                      [class]="
                        'text-sm text-[#191C1D] truncate ' + (notification.read_at ? 'font-normal' : 'font-semibold')
                      "
                    >
                      {{ notification.title }}
                    </p>
                    <p class="text-xs text-gray-500 truncate">{{ notification.body }}</p>
                    <p class="text-[11px] text-[#6C7A99] mt-0.5">
                      {{ notificationTimestamp(notification.created_at) }}
                    </p>
                  </div>
                  @if (!notification.read_at) {
                    <span class="w-2 h-2 rounded-full bg-primary mt-1.5 shrink-0"></span>
                  }
                </button>
              } @empty {
                <p class="text-sm text-gray-500 px-4 py-6 text-center">Sem notificações.</p>
              }
            </div>

            <a
              routerLink="/dashboard/notifications"
              (click)="isNotificationsOpen.set(false)"
              class="block text-center text-sm font-medium text-emerald-700 py-3 hover:bg-tertiary/50 transition-colors border-t border-gray-100"
            >
              Ver todas as notificações
            </a>
          </div>
        }
      </div>

      <button class="px-3 hover:bg-tertiary/80 transition-all cursor-pointer rounded-lg">
        <img src="/icons/dashboard/message-question.svg" alt="" />
      </button>
    </div>

    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu()"
        class="flex gap-3 items-center py-1 px-3 rounded-lg hover:bg-tertiary/80 cursor-pointer transition-all"
      >
        <div class="flex flex-col text-sm text-[#41493D] text-right">
          <h1>Olá, {{ currentUser()?.name }}</h1>
          <p class="text-xs">{{ roleLabel() }}</p>
        </div>

        <img src="/icons/user.svg" alt="" class="h-12 w-12 rounded-full" />
      </button>

      @if (isMenuOpen()) {
        <div
          class="absolute right-0 top-full mt-2 w-44 bg-white rounded-lg shadow-lg border border-[#0000001A] overflow-hidden z-10"
        >
          <a
            routerLink="/dashboard/profile"
            (click)="isMenuOpen.set(false)"
            class="flex items-center gap-2.5 px-4 py-3 text-sm text-[#41493D] hover:bg-tertiary/80 transition-colors"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 12C14.2091 12 16 10.2091 16 8C16 5.79086 14.2091 4 12 4C9.79086 4 8 5.79086 8 8C8 10.2091 9.79086 12 12 12Z"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="M4.5 20C5.5 16.5 8.3 14.5 12 14.5C15.7 14.5 18.5 16.5 19.5 20"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            Perfil
          </a>
          <button
            type="button"
            (click)="logout()"
            class="flex w-full items-center gap-2.5 px-4 py-3 text-sm text-red-600 hover:bg-red-50 cursor-pointer transition-colors"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path
                d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M16 17L21 12L16 7"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path d="M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            Sair
          </button>
        </div>
      }
    </div>
  </div>
</header>
