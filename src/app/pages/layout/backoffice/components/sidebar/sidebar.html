@if (isOpen()) {
  <div
    (click)="close()"
    class="hidden max-lg:block max-lg:fixed max-lg:inset-0 max-lg:z-40 max-lg:bg-black/40"
  ></div>
}

<div
  [class.max-lg:translate-x-0]="isOpen()"
  class="sidebar-scroll w-full min-w-65 h-full flex-col overflow-y-auto gap-5 flex py-8.5 bg-[#094908] text-white border-b border-[#C0C8C6]/40 max-lg:w-72 max-lg:fixed max-lg:inset-y-0 max-lg:left-0 max-lg:z-50 max-lg:-translate-x-full max-lg:transition-transform max-lg:duration-300"
>
  <div class="pb-4 border-b border-white/20 w-fit h-fit ml-4 flex items-center justify-between max-lg:w-full max-lg:pr-4">
    <img src="/logos/logo-horizontal.svg" alt="" class="" />

    <button
      type="button"
      (click)="close()"
      aria-label="Fechar menu"
      class="hidden max-lg:flex items-center justify-center h-8 w-8 rounded-full hover:bg-white/10 cursor-pointer transition-colors"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path
          d="M6 6L18 18M18 6L6 18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>
  @for (item of navItems; track item.title) {
    <div class="flex flex-col gap-5">
      <button
        type="button"
        (click)="toggleGroup(item.title)"
        class="flex items-center justify-between gap-2 mr-4 ml-4 cursor-pointer"
      >
        <h1 class="text-[15px] font-bold">{{ item.title }}</h1>

        <svg
          [class.rotate-90]="!isGroupOpen(item.title)"
          class="transition-transform"
          width="12"
          height="12"
          viewBox="0 0 12 12"
          fill="none"
        >
          <path
            d="M2.5 4.5L6 8L9.5 4.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      @if (isGroupOpen(item.title)) {
        <ul class="flex flex-col gap-2">
          @for (subItem of item.items; track subItem.route) {
            <li class="max-w-58 w-full">
              <a
                routerLinkActive="border-r-4 border-primary bg-[#F8F9FA5C]"
                [routerLinkActiveOptions]="{ exact: subItem.route === '/dashboard' }"
                #rla="routerLinkActive"
                [routerLink]="subItem.route"
                (click)="close()"
                class="pl-8 pr-16 py-3 rounded-r-full w-full flex gap-3 text-[13px] items-center hover:border-r-4 border-primary hover:bg-[#F8F9FA5C] cursor-pointer transition-colors"
              >
                <img [src]="subItem.icon" alt="" class="" />
                <span class="font-medium">{{ subItem.label }}</span>
              </a>
            </li>
          }
        </ul>
      }
    </div>
  }

  <div class="flex flex-col gap-5">
    <h1 class="text-[15px] font-bold ml-4">Configurações</h1>

    <ul class="flex flex-col gap-3">
      <li class="">
        <a
          routerLinkActive="border-r-4 border-primary bg-[#F8F9FA5C]"
          [routerLinkActiveOptions]="{ exact: true }"
          #rla="routerLinkActive"
          routerLink="/dashboard/profile"
          (click)="close()"
          class="pl-8 pr-16 py-3 rounded-r-full w-fit flex gap-3 text-[13px] items-center hover:border-r-4 border-primary hover:bg-[#F8F9FA5C] cursor-pointer transition-colors"
        >
          <img src="/icons/settings/profile.svg" alt="" class="" />
          <span class="font-medium">Meu Perfil</span>
        </a>
      </li>

      <li>
        <button
          type="button"
          (click)="logout()"
          class="flex items-center pl-8 pr-16 py-3 gap-3 text-sm font-semibold text-white rounded-r-full hover:bg-[#F8F9FA5C] cursor-pointer transition-colors"
        >
          <img src="/icons/dashboard/sidebar/logout.svg" alt="" class="" />
          <span class="font-medium">Sair</span>
        </button>
      </li>
    </ul>
  </div>
</div>
